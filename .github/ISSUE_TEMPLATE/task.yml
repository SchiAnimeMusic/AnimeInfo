name: タスク / 課題整理
description: 現在の課題や改善点をタスクとして整理するためのテンプレート
title: "[Task] "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        現在の課題を具体化し、実施内容と完了条件を整理するためのテンプレートです。

  - type: input
    id: summary
    attributes:
      label: 課題概要
      description: 1行で要約してください。
      placeholder: "例: 自動更新ワークフローの実行ログを確認しやすくしたい"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 現状の背景
      description: 発生している現象、原因、関連情報を記載してください。
      placeholder: "例: 現在の更新処理では、失敗時に原因が追いづらい。"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 対応目標
      description: 何を達成したいかを書きます。
      placeholder: "例: 失敗時に原因を確認できるようにする。"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 実施タスク
      description: 具体的な作業内容を箇条書きで記載してください。
      placeholder: |
        - [ ] 調査
        - [ ] 対応方針の決定
        - [ ] 実装
        - [ ] 動作確認
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - 高
        - 中
        - 低
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 関連ファイル / リンク
      description: 参照先や関連Issue、PR、資料があれば記載してください。
      placeholder: "例: scripts/fetch_playlist.py, README.md"

  - type: checkboxes
    id: checklist
    attributes:
      label: 確認項目
      options:
        - label: 影響範囲が明確になっている
        - label: 実施タスクが具体化されている
        - label: 完了条件が定義されている
