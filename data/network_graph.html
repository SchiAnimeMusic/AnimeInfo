<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeInfo ネットワーク可視化</title>
  <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.css" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      background: #f7f8fb;
      color: #222;
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 24px;
    }
    .note {
      margin-bottom: 16px;
      color: #556;
    }
    #network {
      height: 80vh;
      border: 1px solid #d7dce5;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      margin-top: 12px;
      color: #445;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AnimeInfo ネットワーク可視化</h1>
    <div class="note">
      生成済みの JSON データを読み込み、Vis.js でノードとエッジを表示します。初期表示は、人気チャンネルとその再生回数上位の投稿動画に絞り込んで表示します。
    </div>
    <div class="controls">
      <button id="showTop">上位 100 ノード表示</button>
      <button id="showAll">全件表示</button>
      <button id="showChannels">チャンネルのみ</button>
      <button id="showAnime">アニメ作品のみ</button>
    </div>
    <div id="network"></div>
    <div id="status" class="status">データを読み込んでいます...</div>
  </div>

  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const container = document.getElementById('network');
    const showTopBtn = document.getElementById('showTop');
    const showAllBtn = document.getElementById('showAll');
    const showChannelsBtn = document.getElementById('showChannels');
    const showAnimeBtn = document.getElementById('showAnime');

    let fullData = null;
    let network = null;

    async function loadGraphData() {
      try {
        const response = await fetch('./network_data.json');
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        fullData = await response.json();
        updateNetwork();
        enableControls();
      } catch (error) {
        statusEl.textContent = `読み込みに失敗しました: ${error.message}`;
        console.error(error);
      }
    }

    function enableControls() {
      [showTopBtn, showAllBtn, showChannelsBtn, showAnimeBtn].forEach(button => {
        button.disabled = false;
      });
    }

    function computeDegree(data) {
      const degree = {};
      (data.edges || []).forEach(edge => {
        degree[edge.from] = (degree[edge.from] || 0) + 1;
        degree[edge.to] = (degree[edge.to] || 0) + 1;
      });
      return degree;
    }

    function selectGraph(data, nodeFilter) {
      const nodes = (data.nodes || []).filter(nodeFilter);
      const nodeIds = new Set(nodes.map(node => node.id));
      const edges = (data.edges || []).filter(edge => nodeIds.has(edge.from) && nodeIds.has(edge.to));
      return { nodes, edges };
    }

    function selectChannelCluster(data, channelId) {
      const nodeMap = new Map((data.nodes || []).map(node => [node.id, node]));
      const selectedIds = new Set([channelId]);
      (data.edges || []).forEach(edge => {
        if (edge.from === channelId) {
          selectedIds.add(edge.to);
        } else if (edge.to === channelId) {
          selectedIds.add(edge.from);
        }
      });
      const nodes = (data.nodes || []).filter(node => selectedIds.has(node.id));
      const edges = (data.edges || []).filter(edge => selectedIds.has(edge.from) && selectedIds.has(edge.to));
      return { nodes, edges };
    }

    function selectTopChannelVideos(data, channelId, topN = 20) {
      const nodeMap = new Map((data.nodes || []).map(node => [node.id, node]));
      const videoIds = new Set();
      (data.edges || []).forEach(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        if (!fromNode || !toNode) return;
        if (fromNode.type === 'channel' && fromNode.id === channelId && toNode.type !== 'channel') {
          videoIds.add(toNode.id);
        }
        if (toNode.type === 'channel' && toNode.id === channelId && fromNode.type !== 'channel') {
          videoIds.add(fromNode.id);
        }
      });
      const videos = Array.from(videoIds)
        .map(id => nodeMap.get(id))
        .filter(Boolean)
        .sort((a, b) => Number(b.metric_value || 0) - Number(a.metric_value || 0))
        .slice(0, topN);
      const selectedIds = new Set([channelId, ...videos.map(video => video.id)]);
      const nodes = (data.nodes || []).filter(node => selectedIds.has(node.id));
      const edges = (data.edges || []).filter(edge => selectedIds.has(edge.from) && selectedIds.has(edge.to));
      return { nodes, edges };
    }

    function getTopPopularChannel(data) {
      const nodeMap = new Map((data.nodes || []).map(node => [node.id, node]));
      const channelStats = new Map();

      (data.nodes || []).forEach(node => {
        if (node.type === 'channel') {
          channelStats.set(node.id, { node, videoCount: 0 });
        }
      });

      (data.edges || []).forEach(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        if (!fromNode || !toNode) return;
        if (fromNode.type === 'channel' && toNode.type !== 'channel') {
          const stats = channelStats.get(fromNode.id);
          if (stats) {
            stats.videoCount += 1;
            stats.totalVideoViews += Number(toNode.metric_value || 0);
          }
        }
        if (toNode.type === 'channel' && fromNode.type !== 'channel') {
          const stats = channelStats.get(toNode.id);
          if (stats) {
            stats.videoCount += 1;
            stats.totalVideoViews += Number(fromNode.metric_value || 0);
          }
        }
      });

      let topChannel = null;
      let topScore = -Infinity;
      channelStats.forEach(({ node, totalVideoViews }) => {
        const subscribers = Number(node.metric_value || 0);
        const score = totalVideoViews + subscribers * 1000;
        if (score > topScore) {
          topScore = score;
          topChannel = node;
        }
      });
      return topChannel;
    }

    function buildGraphData(data) {
      const nodes = new vis.DataSet(
        (data.nodes || []).map(node => {
          const metricValue = Number(node.metric_value || 0);
          const originalShape = node.shape || 'dot';
          const shape = node.type === 'channel' && originalShape === 'image' ? 'circularImage' : originalShape;
          const imageShape = shape === 'image' || shape === 'circularImage';
          const computedSize = metricValue > 0
            ? (node.type === 'channel'
                ? Math.max(32, 28 + Math.min(48, Math.log10(metricValue + 1) * 14))
                : Math.max(28, 24 + Math.min(36, Math.log10(metricValue + 1) * 16)))
            : (node.type === 'channel' ? 40 : 32);
          const size = typeof node.size === 'number' ? node.size : (imageShape ? Math.max(computedSize, node.type === 'channel' ? 56 : 44) : computedSize);

          const metricLabel = node.type === 'channel'
            ? `登録者数<br/><b>${metricValue.toLocaleString()}人</b>`
            : `再生回数<br/><b>${metricValue.toLocaleString()}回</b>`;
          const tooltipText = node.label
            ? `<div style="line-height:1.4;"><div style="font-weight:700; margin-bottom:4px;">${node.label}</div><div>${metricLabel}</div></div>`
            : `<div style="line-height:1.4;"><div>${metricLabel}</div></div>`;

          return {
            ...node,
            title: tooltipText,
            label: '',
            displayLabel: node.label || '',
            color: node.type === 'channel' ? '#4f83cc' : '#f59e0b',
            font: {
              color: '#111827',
              face: 'Segoe UI, Yu Gothic UI, sans-serif',
              size: 14,
              strokeWidth: 0,
            },
            shape,
            size,
            value: metricValue > 0 ? metricValue : undefined,
            shadow: {
              enabled: true,
              color: 'rgba(0, 0, 0, 0.18)',
              size: 10,
              x: 0,
              y: 0,
            },
            shapeProperties: imageShape ? {
              useBorderWithImage: true,
              useImageSize: false,
            } : undefined,
          };
        })
      );

      const edges = new vis.DataSet(
        (data.edges || []).map(edge => ({
          ...edge,
          title: edge.label || '関連動画',
          color: {
            color: '#9ca3af',
            highlight: '#4f83cc',
          },
          arrows: edge.arrows || 'to',
          font: {
            color: '#111827',
            size: 10,
          },
          smooth: {
            enabled: true,
            type: 'dynamic',
          },
          width: 1,
        }))
      );

      return { nodes, edges };
    }

    function renderGraph(data, label) {
      const graph = buildGraphData(data);
      const options = {
        physics: {
          stabilization: {
            enabled: true,
            iterations: 200,
            updateInterval: 50,
          },
          barnesHut: {
            gravitationalConstant: -8000,
            springLength: 120,
            springConstant: 0.04,
            damping: 0.09,
          },
        },
        interaction: {
          hover: true,
          tooltipDelay: 100,
          dragNodes: true,
          zoomView: true,
          dragView: true,
          navigationButtons: true,
          keyboard: true,
        },
        nodes: {
          borderWidth: 2,
          borderWidthSelected: 4,
          font: {
            size: 14,
            color: '#111827',
          },
          scaling: {
            min: 24,
            max: 80,
          },
          shapeProperties: {
            useBorderWithImage: true,
          },
        },
        edges: {
          smooth: true,
        },
        layout: {
          improvedLayout: true,
        },
      };

      if (network) {
        network.setData(graph);
        network.setOptions(options);
      } else {
        network = new vis.Network(container, graph, options);
      }

      network.on('click', function (params) {
        if (!params.nodes || params.nodes.length === 0) return;
        const nodeId = params.nodes[0];
        const node = graph.nodes.get(nodeId);
        if (node && node.url) {
          window.open(node.url, '_blank', 'noopener,noreferrer');
        }
      });

      network.on('selectNode', function (params) {
        const nodeId = params.nodes[0];
        if (!nodeId) return;
        const node = graph.nodes.get(nodeId);
        if (node) {
          graph.nodes.update({
            id: nodeId,
            label: node.displayLabel || node.label || '',
            font: { ...(node.font || {}), color: '#111827' }
          });
        }
      });

      network.on('deselectNode', function () {
        graph.nodes.forEach(node => {
          graph.nodes.update({ id: node.id, label: '' });
        });
      });

      network.on('hoverNode', function (params) {
        const node = graph.nodes.get(params.node);
        if (node) {
          graph.nodes.update({
            id: params.node,
            label: node.displayLabel || node.label || '',
            font: { ...(node.font || {}), color: '#111827' }
          });
        }
      });

      network.on('blurNode', function (params) {
        graph.nodes.update({ id: params.node, label: '' });
      });

      statusEl.textContent = `${label} 表示中: ${data.nodes.length} ノード / ${data.edges.length} エッジ`;
    }

    function updateNetwork() {
      if (!fullData) return;
      const topChannel = getTopPopularChannel(fullData);
      if (topChannel) {
        const filtered = selectTopChannelVideos(fullData, topChannel.id, 20);
        renderGraph(filtered, `人気チャンネル動画: ${topChannel.label || topChannel.id}`);
        return;
      }

      const degree = computeDegree(fullData);
      const topIds = Object.entries(degree)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 100)
        .map(([id]) => Number(id));
      const filtered = selectGraph(fullData, node => topIds.includes(node.id));
      renderGraph(filtered, '上位 100 ノード');
    }

    showTopBtn.addEventListener('click', updateNetwork);
    showAllBtn.addEventListener('click', () => renderGraph(fullData, '全件'));
    showChannelsBtn.addEventListener('click', () => {
      const filtered = selectGraph(fullData, node => node.type === 'channel');
      renderGraph(filtered, 'チャンネルのみ');
    });
    showAnimeBtn.addEventListener('click', () => {
      const filtered = selectGraph(fullData, node => node.type === 'anime');
      renderGraph(filtered, 'アニメ作品のみ');
    });

    loadGraphData();
  </script>
</body>
</html>
