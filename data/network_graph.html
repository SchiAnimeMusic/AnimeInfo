<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeInfo ネットワーク可視化</title>
  <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.css" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      background: #f7f8fb;
      color: #222;
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 24px;
    }
    .note {
      margin-bottom: 16px;
      color: #556;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .controls button,
    .search-bar button {
      padding: 8px 14px;
      border: 1px solid #c7d2fe;
      border-radius: 6px;
      background: #eef2ff;
      color: #1f2937;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .controls button:hover,
    .search-bar button:hover {
      background: #e0e7ff;
      transform: translateY(-1px);
    }
    .controls button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1 1 280px;
      min-width: 220px;
      max-width: 440px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      background: #fff;
    }
    .search-bar input:focus {
      outline: 2px solid rgba(79, 70, 229, 0.2);
      border-color: #6366f1;
    }
    .search-suggestions {
      display: none;
      width: min(100%, 520px);
      margin-top: -8px;
      margin-bottom: 12px;
      padding: 8px;
      border: 1px solid #dbe4ff;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.08);
    }
    .search-suggestions.visible {
      display: block;
    }
    .search-suggestion {
      display: block;
      width: 100%;
      border: none;
      background: #f8fafc;
      text-align: left;
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 6px;
      color: #1f2937;
      cursor: pointer;
      font-size: 14px;
    }
    .search-suggestion:hover {
      background: #eef2ff;
    }
    #network {
      position: relative;
      height: 80vh;
      border: 1px solid #d7dce5;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .status {
      margin-top: 12px;
      color: #445;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AnimeInfo ネットワーク可視化</h1>
    <div class="note">
      生成済みの JSON データを読み込み、Vis.js でノードとエッジを表示します。初期表示または検索クリア後は、投稿動画数が最も多いチャンネルとその投稿動画に絞り込みます。
    </div>
    <div class="search-bar">
      <input id="searchInput" type="search" placeholder="動画タイトル・チャンネル名で検索" aria-label="動画タイトルまたはチャンネル名で検索" />
      <button id="searchBtn" type="button">検索</button>
      <button id="clearSearchBtn" type="button">クリア</button>
    </div>
    <div id="searchSuggestions" class="search-suggestions" aria-live="polite"></div>
    <div id="network"></div>
    <div id="status" class="status">データを読み込んでいます...</div>
  </div>

  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const container = document.getElementById('network');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const searchSuggestions = document.getElementById('searchSuggestions');

    let fullData = null;
    let network = null;

    async function loadGraphData() {
      try {
        const graphResponse = await fetch('./network_data.json');

        if (!graphResponse.ok) {
          throw new Error(`HTTP ${graphResponse.status}`);
        }

        fullData = await graphResponse.json();
        updateNetwork();
      } catch (error) {
        statusEl.textContent = `読み込みに失敗しました: ${error.message}`;
        console.error(error);
      }
    }

    function computeDegree(data) {
      const degree = {};
      (data.edges || []).forEach(edge => {
        degree[edge.from] = (degree[edge.from] || 0) + 1;
        degree[edge.to] = (degree[edge.to] || 0) + 1;
      });
      return degree;
    }

    function selectGraph(data, nodeFilter) {
      const nodes = (data.nodes || []).filter(nodeFilter);
      const nodeIds = new Set(nodes.map(node => node.id));
      const edges = (data.edges || []).filter(edge => nodeIds.has(edge.from) && nodeIds.has(edge.to));
      return { nodes, edges };
    }

    function normalizeSearchKeyword(value) {
      return String(value || '').trim().toLowerCase();
    }

    function matchesSearchKeyword(node, keyword) {
      const textValues = [
        node.label,
        node.title,
        node.displayLabel,
        node.id,
        node.url,
        node.series_name,
        node.anime_key,
        node.channel_name,
        node.type,
      ].filter(Boolean);

      return textValues.some(value => String(value).toLowerCase().includes(keyword));
    }

    function getSearchCandidates(data, keyword, limit = 10) {
      const normalizedKeyword = normalizeSearchKeyword(keyword);
      if (!normalizedKeyword) return [];

      return (data.nodes || [])
        .filter(node => matchesSearchKeyword(node, normalizedKeyword))
        .map(node => {
          const label = String(node.label || node.displayLabel || node.id || '').toLowerCase();
          let score = 0;

          if (label.includes(normalizedKeyword)) score += 30;
          if (node.type === 'anime') score += 5;
          if (node.type === 'channel') score += 2;
          return { ...node, score };
        })
        .sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          return String(a.label || a.id).localeCompare(String(b.label || b.id), 'ja');
        })
        .slice(0, limit);
    }

    function selectSearchMatches(data, keyword) {
      const normalizedKeyword = normalizeSearchKeyword(keyword);
      if (!normalizedKeyword) return null;

      const matches = (data.nodes || []).filter(node => matchesSearchKeyword(node, normalizedKeyword));
      if (matches.length === 0) {
        return { nodes: [], edges: [], noResults: true };
      }

      const matchedIds = new Set(matches.map(node => node.id));
      const selectedIds = new Set(matchedIds);
      (data.edges || []).forEach(edge => {
        // Expand only from the matched nodes. This prevents a series of edges
        // from progressively pulling the entire graph into the search result.
        if (matchedIds.has(edge.from) || matchedIds.has(edge.to)) {
          selectedIds.add(edge.from);
          selectedIds.add(edge.to);
        }
      });

      const nodes = (data.nodes || []).filter(node => selectedIds.has(node.id));
      const edges = (data.edges || []).filter(edge => selectedIds.has(edge.from) && selectedIds.has(edge.to));
      return { nodes, edges, noResults: false };
    }

    function selectNodeCluster(data, nodeId) {
      const selectedIds = new Set([nodeId]);
      (data.edges || []).forEach(edge => {
        if (edge.from === nodeId || edge.to === nodeId) {
          selectedIds.add(edge.from);
          selectedIds.add(edge.to);
        }
      });
      const nodes = (data.nodes || []).filter(node => selectedIds.has(node.id));
      const edges = (data.edges || []).filter(edge => selectedIds.has(edge.from) && selectedIds.has(edge.to));
      return { nodes, edges };
    }

    function selectChannelCluster(data, channelId) {
      const nodeMap = new Map((data.nodes || []).map(node => [node.id, node]));
      const selectedIds = new Set([channelId]);
      (data.edges || []).forEach(edge => {
        if (edge.from === channelId) {
          selectedIds.add(edge.to);
        } else if (edge.to === channelId) {
          selectedIds.add(edge.from);
        }
      });
      const nodes = (data.nodes || []).filter(node => selectedIds.has(node.id));
      const edges = (data.edges || []).filter(edge => selectedIds.has(edge.from) && selectedIds.has(edge.to));
      return { nodes, edges };
    }

    function selectTopChannelVideos(data, channelId) {
      const nodeMap = new Map((data.nodes || []).map(node => [node.id, node]));
      const videoIds = new Set();
      (data.edges || []).forEach(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        if (!fromNode || !toNode) return;
        if (fromNode.type === 'channel' && fromNode.id === channelId && toNode.type !== 'channel') {
          videoIds.add(toNode.id);
        }
        if (toNode.type === 'channel' && toNode.id === channelId && fromNode.type !== 'channel') {
          videoIds.add(fromNode.id);
        }
      });
      const videos = Array.from(videoIds)
        .map(id => nodeMap.get(id))
        .filter(Boolean)
        .sort((a, b) => Number(b.metric_value || 0) - Number(a.metric_value || 0));
      const selectedIds = new Set([channelId, ...videos.map(video => video.id)]);
      const nodes = (data.nodes || []).filter(node => selectedIds.has(node.id));
      const edges = (data.edges || []).filter(edge => selectedIds.has(edge.from) && selectedIds.has(edge.to));
      return { nodes, edges };
    }

    function getTopVideoCountChannel(data) {
      const nodeMap = new Map((data.nodes || []).map(node => [node.id, node]));
      const channelStats = new Map();

      (data.nodes || []).forEach(node => {
        if (node.type === 'channel') {
          channelStats.set(node.id, { node, videoIds: new Set() });
        }
      });

      (data.edges || []).forEach(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        if (!fromNode || !toNode) return;
        if (fromNode.type === 'channel' && toNode.type !== 'channel') {
          const stats = channelStats.get(fromNode.id);
          if (stats) {
            stats.videoIds.add(toNode.id);
          }
        }
        if (toNode.type === 'channel' && fromNode.type !== 'channel') {
          const stats = channelStats.get(toNode.id);
          if (stats) {
            stats.videoIds.add(fromNode.id);
          }
        }
      });

      let topChannel = null;
      let topVideoCount = -1;
      channelStats.forEach(({ node, videoIds }) => {
        if (videoIds.size > topVideoCount) {
          topVideoCount = videoIds.size;
          topChannel = node;
        }
      });
      return topChannel;
    }

    function buildGraphData(data) {
      const nodes = new vis.DataSet(
        (data.nodes || []).map(node => {
          const metricValue = Number(node.metric_value || 0);
          const originalShape = node.shape || 'dot';
          const shape = node.type === 'channel' && originalShape === 'image' ? 'circularImage' : originalShape;
          const imageShape = shape === 'image' || shape === 'circularImage';
          const computedSize = metricValue > 0
            ? (node.type === 'channel'
                ? Math.max(32, 28 + Math.min(48, Math.log10(metricValue + 1) * 14))
                : Math.max(28, 24 + Math.min(36, Math.log10(metricValue + 1) * 16)))
            : (node.type === 'channel' ? 40 : 32);
          const size = typeof node.size === 'number' ? node.size : (imageShape ? Math.max(computedSize, node.type === 'channel' ? 56 : 44) : computedSize);

          const metricLabel = node.type === 'channel'
            ? `登録者数<br/><b>${metricValue.toLocaleString()}人</b>`
            : `再生回数<br/><b>${metricValue.toLocaleString()}回</b>`;
          const tooltipText = node.label
            ? `<div style="line-height:1.4;"><div style="font-weight:700; margin-bottom:4px;">${node.label}</div><div>${metricLabel}</div></div>`
            : `<div style="line-height:1.4;"><div>${metricLabel}</div></div>`;

          return {
            ...node,
            title: tooltipText,
            label: '',
            displayLabel: node.label || '',
            color: node.type === 'channel' ? '#4f83cc' : '#f59e0b',
            font: {
              color: '#111827',
              face: 'Segoe UI, Yu Gothic UI, sans-serif',
              size: 14,
              strokeWidth: 0,
            },
            shape,
            size,
            value: metricValue > 0 ? metricValue : undefined,
            shadow: {
              enabled: true,
              color: 'rgba(0, 0, 0, 0.18)',
              size: 10,
              x: 0,
              y: 0,
            },
            borderWidth: node.type === 'channel' ? 2 : 0,
            borderWidthSelected: node.type === 'channel' ? 4 : 0,
            shapeProperties: imageShape ? {
              useBorderWithImage: true,
              useImageSize: false,
            } : undefined,
          };
        })
      );

      const edges = new vis.DataSet(
        (data.edges || []).map(edge => ({
          ...edge,
          label: '',
          title: '',
          color: {
            color: edge.series_link ? '#7c3aed' : '#9ca3af',
            highlight: edge.series_link ? '#6d28d9' : '#4f83cc',
          },
          arrows: edge.arrows || 'to',
          font: {
            color: '#111827',
            size: 12,
            align: 'middle',
            background: '#ffffff',
            strokeWidth: 3,
            strokeColor: '#ffffff',
          },
          smooth: {
            enabled: true,
            type: 'dynamic',
          },
          width: edge.series_link ? 2 : 1,
        }))
      );

      return { nodes, edges };
    }

    function normalizeSeriesTitle(title) {
      return title
        .replace(/[〜～].*?[〜～]/g, ' ')
        .replace(/\s*第\s*\d+\s*話.*$/g, '')
        .replace(/\s*[／/|].*$/g, '')
        .trim();
    }

    function normalizeSeriesKey(value) {
      return String(value || '')
        .normalize('NFKC')
        .toLocaleLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, '');
    }

    function getSeriesKey(node) {
      const metadataKey = node.series_key || node.anime_key;
      if (metadataKey) return normalizeSeriesKey(metadataKey);
      let key = node.series_name || node.label || '';
      const titleMatches = Array.from(key.matchAll(/[『「]([^』」]+)[』」]/g));
      const animeTitleMatch = titleMatches.reverse().find(match => /(?:TV\s*)?アニメ\s*$/.test(key.slice(0, match.index)));
      if (animeTitleMatch) return normalizeSeriesKey(normalizeSeriesTitle(animeTitleMatch[1]));
      const pipeParts = key.split(/[|｜]/).map(part => part.trim()).filter(Boolean);
      const seriesPart = pipeParts.find(part => /アニメ|EXCEEDS|シリーズ/i.test(part) && !/ノンクレジット|\b(?:OP|ED)\b/i.test(part));
      if (seriesPart) return normalizeSeriesKey(normalizeSeriesTitle(seriesPart.replace(/^TV\s*アニメ\s*/i, '')));
      if (titleMatches.length === 1) return normalizeSeriesKey(normalizeSeriesTitle(titleMatches[0][1]));
      const leadingTitleMatch = key.split(/[／/|｜]/)[0].match(/[『「]([^』」]+)[』」]/);
      if (leadingTitleMatch) return normalizeSeriesKey(normalizeSeriesTitle(leadingTitleMatch[1]));
      key = key.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
      key = key.replace(/#\s*\d+\s*[「『][^」』]+[」』]/g, ' ');
      key = key.replace(/TV\s*アニメ|ノンクレジット|ノンテロップ|TV放送版|歌詞付き|オープニング|エンディング|主題歌|テーマ|ミュージックビデオ|挿入歌|スペシャル|映像|ムービー|\b(?:OP|ED|MV)\b/gi, ' ');
      key = key.replace(/第\s*\d+\s*(?:クール|シーズン|期)|(?:前期|後期)|\bSeason\s*\d+\b/gi, ' ');
      return normalizeSeriesKey(key.replace(/[『』「」【】|｜]/g, ' ').replace(/\s+/g, ' ').trim() || key);
    }

    function compareSeriesOrder(left, right) {
      const seasonDelta = Number(left.season_order ?? 99) - Number(right.season_order ?? 99);
      if (seasonDelta !== 0) return seasonDelta;
      const priorityDelta = Number(left.priority_order ?? 99) - Number(right.priority_order ?? 99);
      if (priorityDelta !== 0) return priorityDelta;
      const metricDelta = Number(right.metric_value || 0) - Number(left.metric_value || 0);
      if (metricDelta !== 0) return metricDelta;
      return String(left.label || '').localeCompare(String(right.label || ''));
    }

    function buildSeriesSequenceData(data) {
      const nodes = (data.nodes || []).map(node => ({ ...node }));
      const nodeMap = new Map(nodes.map(node => [node.id, node]));
      const groups = new Map();

      nodes.forEach(node => {
        if (node.type !== 'anime') return;
        const key = getSeriesKey(node);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(node);
      });

      const firstByChannelAndSeries = new Map();
      groups.forEach(seriesNodes => {
        seriesNodes.sort(compareSeriesOrder);
        seriesNodes.forEach((node, index) => {
          node.group = getSeriesKey(node);
          node.series_index = index;
        });
      });

      (data.edges || []).forEach(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        if (!fromNode || !toNode) return;
        const channelNode = fromNode.type === 'channel' ? fromNode : toNode.type === 'channel' ? toNode : null;
        const animeNode = fromNode.type === 'anime' ? fromNode : toNode.type === 'anime' ? toNode : null;
        if (!channelNode || !animeNode) return;
        const seriesKey = getSeriesKey(animeNode);
        const key = `${channelNode.id}:${seriesKey}`;
        const current = firstByChannelAndSeries.get(key);
        if (!current || compareSeriesOrder(animeNode, current) < 0) {
          firstByChannelAndSeries.set(key, animeNode);
        }
      });

      const edges = (data.edges || []).filter(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        if (!fromNode || !toNode) return true;
        const channelNode = fromNode.type === 'channel' ? fromNode : toNode.type === 'channel' ? toNode : null;
        const animeNode = fromNode.type === 'anime' ? fromNode : toNode.type === 'anime' ? toNode : null;
        if (!channelNode || !animeNode) return true;
        const seriesKey = getSeriesKey(animeNode);
        return firstByChannelAndSeries.get(`${channelNode.id}:${seriesKey}`)?.id === animeNode.id;
      }).map(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        const animeNode = fromNode?.type === 'anime' ? fromNode : toNode?.type === 'anime' ? toNode : null;
        return animeNode ? { ...edge, label: getSeriesKey(animeNode) } : edge;
      });

      const edgeKeys = new Set(edges.map(edge => `${edge.from}:${edge.to}`));
      groups.forEach(seriesNodes => {
        for (let index = 1; index < seriesNodes.length; index += 1) {
          const edge = {
            from: seriesNodes[index - 1].id,
            to: seriesNodes[index].id,
            arrows: 'to',
            dashes: true,
            series_link: true,
          };
          const edgeKey = `${edge.from}:${edge.to}`;
          if (!edgeKeys.has(edgeKey)) {
            edges.push(edge);
            edgeKeys.add(edgeKey);
          }
        }
      });

      const connectedNodeIds = new Set();
      edges.forEach(edge => {
        connectedNodeIds.add(edge.from);
        connectedNodeIds.add(edge.to);
      });
      const filteredNodes = nodes.filter(node => (
        node.type !== 'channel' || connectedNodeIds.has(node.id)
      ));

      return { nodes: filteredNodes, edges };
    }

    function applyAnimeSeriesOrdering(data) {
      const groups = new Map();
      (data.nodes || []).forEach(node => {
        if (node.type !== 'anime') return;
        const key = getSeriesKey(node);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(node);
      });

      groups.forEach(nodes => {
        nodes.sort((a, b) => {
          const seasonDelta = Number(a.season_order ?? 99) - Number(b.season_order ?? 99);
          if (seasonDelta !== 0) return seasonDelta;
          const priorityDelta = Number(a.priority_order ?? 99) - Number(b.priority_order ?? 99);
          if (priorityDelta !== 0) return priorityDelta;
          return Number(b.metric_value || 0) - Number(a.metric_value || 0);
        });

        nodes.forEach((node, index) => {
          node.group = getSeriesKey(node);
        });
      });
    }

    function applyRadialLayout(data) {
      const nodes = (data.nodes || []).map(node => ({ ...node }));
      const nodeMap = new Map(nodes.map(node => [node.id, node]));
      const channels = nodes.filter(node => node.type === 'channel');
      const videosByChannel = new Map(channels.map(channel => [channel.id, []]));
      const assignedVideos = new Set();

      (data.edges || []).forEach(edge => {
        const fromNode = nodeMap.get(edge.from);
        const toNode = nodeMap.get(edge.to);
        if (!fromNode || !toNode) return;
        const channel = fromNode.type === 'channel' ? fromNode : toNode.type === 'channel' ? toNode : null;
        const video = fromNode.type === 'anime' ? fromNode : toNode.type === 'anime' ? toNode : null;
        if (!channel || !video || !videosByChannel.has(channel.id) || assignedVideos.has(video.id)) return;
        videosByChannel.get(channel.id).push(video);
        assignedVideos.add(video.id);
      });

      const channelDistance = Math.max(650, channels.length * 45);
      channels.forEach((channel, index) => {
        const channelAngle = channels.length > 1 ? (2 * Math.PI * index) / channels.length : 0;
        const channelX = channels.length > 1 ? Math.cos(channelAngle) * channelDistance : 0;
        const channelY = channels.length > 1 ? Math.sin(channelAngle) * channelDistance : 0;
        channel.x = channelX;
        channel.y = channelY;

        const videos = videosByChannel.get(channel.id) || [];
        const videoDistance = Math.max(220, videos.length * 28);
        videos.forEach((video, videoIndex) => {
          const videoAngle = (2 * Math.PI * videoIndex) / Math.max(videos.length, 1);
          video.x = channelX + Math.cos(videoAngle) * videoDistance;
          video.y = channelY + Math.sin(videoAngle) * videoDistance;
        });
      });

      nodes.filter(node => !Number.isFinite(node.x) || !Number.isFinite(node.y)).forEach((node, index) => {
        const angle = (2 * Math.PI * index) / Math.max(nodes.length, 1);
        node.x = Math.cos(angle) * 300;
        node.y = Math.sin(angle) * 300;
      });

      return { nodes, edges: data.edges || [] };
    }

    function renderGraph(data, label) {
      const radialData = applyRadialLayout(data);
      const sequenceData = buildSeriesSequenceData(radialData);
      applyAnimeSeriesOrdering(sequenceData);

      const graph = buildGraphData(sequenceData);
      const options = {
        physics: {
          enabled: true,
          stabilization: {
            enabled: true,
            iterations: 200,
            updateInterval: 50,
          },
          barnesHut: {
            gravitationalConstant: -8000,
            springLength: 120,
            springConstant: 0.04,
            damping: 0.09,
          },
        },
        interaction: {
          hover: true,
          tooltipDelay: 100,
          dragNodes: true,
          zoomView: true,
          dragView: true,
          navigationButtons: true,
          keyboard: true,
        },
        nodes: {
          borderWidth: 2,
          borderWidthSelected: 4,
          font: {
            size: 14,
            color: '#111827',
          },
          scaling: {
            min: 24,
            max: 80,
          },
          shapeProperties: {
            useBorderWithImage: true,
          },
        },
        edges: {
          smooth: true,
          arrows: {
            to: { enabled: true, scaleFactor: 1 }
          },
        },
        layout: {
          improvedLayout: false,
        },
      };

      if (network) {
        network.setOptions(options);
        network.setData(graph);
      } else {
        network = new vis.Network(container, graph, options);
      }
      network.fit({ animation: false, minZoomLevel: 0.1, maxZoomLevel: 2 });

      network.on('click', function (params) {
        if (!params.nodes || params.nodes.length === 0) return;
        const nodeId = params.nodes[0];
        const node = graph.nodes.get(nodeId);
        if (node && node.url) {
          window.open(node.url, '_blank', 'noopener,noreferrer');
        }
      });

      network.on('selectNode', function (params) {
        const nodeId = params.nodes[0];
        if (!nodeId) return;
        const node = graph.nodes.get(nodeId);
        if (node) {
          graph.nodes.update({
            id: nodeId,
            label: node.displayLabel || node.label || '',
            font: { ...(node.font || {}), color: '#111827' }
          });
        }
      });

      network.on('deselectNode', function () {
        graph.nodes.forEach(node => {
          graph.nodes.update({ id: node.id, label: '' });
        });
      });

      network.on('hoverNode', function (params) {
        const node = graph.nodes.get(params.node);
        if (node) {
          graph.nodes.update({
            id: params.node,
            label: node.displayLabel || node.label || '',
            font: { ...(node.font || {}), color: '#111827' }
          });
        }
      });

      network.on('blurNode', function (params) {
        graph.nodes.update({ id: params.node, label: '' });
      });

      statusEl.textContent = `${label} 表示中: ${data.nodes.length} ノード / ${data.edges.length} エッジ`;
    }

    function updateNetwork() {
      if (!fullData) return;
      const topChannel = getTopVideoCountChannel(fullData);
      if (topChannel) {
        const filtered = selectTopChannelVideos(fullData, topChannel.id);
        renderGraph(filtered, `投稿動画数最多: ${topChannel.label || topChannel.id}`);
        return;
      }

      renderTopNodes();
    }

    function renderTopNodes() {
      if (!fullData) return;
      const degree = computeDegree(fullData);
      const rankedNodes = (fullData.nodes || [])
        .slice()
        .sort((a, b) => (degree[b.id] || 0) - (degree[a.id] || 0))
      const selectedIds = new Set(rankedNodes.slice(0, 100).map(node => node.id));
      const selectedChannels = new Set(rankedNodes.slice(0, 100)
        .filter(node => node.type === 'channel')
        .map(node => node.id));
      const nodeMap = new Map((fullData.nodes || []).map(node => [node.id, node]));

      (fullData.edges || []).forEach(edge => {
        const channelId = selectedChannels.has(edge.from) ? edge.from : selectedChannels.has(edge.to) ? edge.to : null;
        if (!channelId) return;
        const otherId = edge.from === channelId ? edge.to : edge.from;
        if (nodeMap.get(otherId)?.type === 'anime') selectedIds.add(otherId);
      });

      const filtered = selectGraph(fullData, node => selectedIds.has(node.id));
      renderGraph(filtered, '上位 100 ノード');
    }

    function renderSearchSuggestions(candidates) {
      if (!candidates || candidates.length === 0) {
        searchSuggestions.classList.remove('visible');
        searchSuggestions.innerHTML = '';
        return;
      }

      const items = candidates.map(node => {
        const label = node.label || node.displayLabel || node.id;
        const typeLabel = node.type === 'anime' ? 'アニメ' : node.type === 'channel' ? 'チャンネル' : '関連';
        return `<button type="button" class="search-suggestion" data-node-id="${node.id}">${label} <span style="color:#64748b;">(${typeLabel})</span></button>`;
      }).join('');

      searchSuggestions.innerHTML = items;
      searchSuggestions.classList.add('visible');

      searchSuggestions.querySelectorAll('.search-suggestion').forEach(button => {
        button.addEventListener('click', () => {
          const nodeId = Number(button.dataset.nodeId);
          const node = (fullData.nodes || []).find(item => item.id === nodeId);
          if (!node) return;
          searchInput.value = node.label || node.displayLabel || node.id;
          clearSearchState();
        });
      });
    }

    function clearSearchState() {
      searchSuggestions.classList.remove('visible');
      searchSuggestions.innerHTML = '';
    }

    function performSearch() {
      if (!fullData) return;
      const query = searchInput.value;
      const keyword = normalizeSearchKeyword(query);

      if (!keyword) {
        clearSearchState();
        updateNetwork();
        return;
      }

      const candidates = getSearchCandidates(fullData, keyword, 12);
      renderSearchSuggestions(candidates);

      const filtered = selectSearchMatches(fullData, keyword);
      if (!filtered || filtered.noResults) {
        statusEl.textContent = `「${query.trim()}」に一致するアニメまたはチャンネルは見つかりませんでした。`;
        return;
      }

      renderGraph(filtered, `検索: ${query.trim()}`);
    }

    searchBtn.addEventListener('click', performSearch);
    clearSearchBtn.addEventListener('click', () => {
      clearSearchState();
      searchInput.value = '';
      updateNetwork();
    });
    searchInput.addEventListener('input', () => {
      const keyword = normalizeSearchKeyword(searchInput.value);
      if (!keyword) {
        clearSearchState();
        return;
      }
      renderSearchSuggestions(getSearchCandidates(fullData, keyword, 12));
    });
    loadGraphData();
  </script>
</body>
</html>
